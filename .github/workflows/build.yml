name: Binary builder

on:
  push:
    tags:
    - '*'

jobs:
  windows:
    name: Windows
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v5
    - uses: actions/setup-python@v5
      with:
        python-version-file: ".python-version"
    - name: Install dependencies
      env:
        PYINSTALLER_COMPILE_BOOTLOADER: 1
      run: uv sync --dev --no-binary-package pyinstaller
    - name: Build binary
      run: uv run pyinstaller CurseBreaker.spec
    - name: Upload binary
      uses: actions/upload-artifact@v4
      with:
        name: Windows
        path: dist/CurseBreaker.exe

  linux:
    name: Linux
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v5
    - uses: actions/setup-python@v5
      with:
        python-version-file: ".python-version"
    - name: Install dependencies
      run: uv sync --dev
    - name: Build binary
      run: uv run pyinstaller CurseBreaker.spec
    - name: Upload binary
      uses: actions/upload-artifact@v4
      with:
        name: Linux
        path: dist/CurseBreaker

  macos:
    name: macOS
    runs-on: macos-14
    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v5
    - uses: actions/setup-python@v5
      with:
        python-version-file: ".python-version"
    - name: Install dependencies
      run: uv sync --dev
    - name: Build binary
      run: uv run pyinstaller CurseBreaker.spec
    - name: Upload binary
      uses: actions/upload-artifact@v4
      with:
        name: macOS
        path: dist/CurseBreaker

  release:
    name: Create Release
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
    - name: Prepare release assets
      run: |
        mv artifacts/Windows/CurseBreaker.exe artifacts/
        zip -j artifacts/CurseBreaker-linux.zip artifacts/Linux/CurseBreaker
        zip -j artifacts/CurseBreaker-macos.zip artifacts/macOS/CurseBreaker
    - name: Create draft release
      uses: softprops/action-gh-release@v2
      with:
        draft: true
        generate_release_notes: true
        files: |
          artifacts/CurseBreaker.exe
          artifacts/CurseBreaker-linux.zip
          artifacts/CurseBreaker-macos.zip
